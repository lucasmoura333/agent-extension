<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      width: 380px; 
      padding: 0; 
      font-family: 'Segoe UI', sans-serif; 
      background: #f0f2f5;
    }
    
    .header {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .header h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    
    .header .subtitle {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }
    
    .status-dot.active { background: #25D366; }
    .status-dot.inactive { background: #ff5252; }
    
    .status-text {
      font-size: 13px;
      color: #666;
    }
    
    .content {
      padding: 15px;
      max-height: 350px;
      overflow-y: auto;
    }
    
    .section-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    
    .profiles-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .profile-card {
      background: white;
      border-radius: 10px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    
    .profile-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .profile-card.active {
      border-color: #25D366;
      background: #e8f5e9;
    }
    
    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #25D366, #128C7E);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .profile-info {
      flex: 1;
      min-width: 0;
    }
    
    .profile-name {
      font-weight: 600;
      font-size: 14px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .profile-subtitle {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .profile-actions {
      display: flex;
      gap: 5px;
    }
    
    .btn-icon {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 14px;
    }
    
    .btn-edit {
      background: #e3f2fd;
      color: #1976d2;
    }
    
    .btn-edit:hover {
      background: #bbdefb;
    }
    
    .btn-delete {
      background: #ffebee;
      color: #c62828;
    }
    
    .btn-delete:hover {
      background: #ffcdd2;
    }
    
    .empty-state {
      text-align: center;
      padding: 30px;
      color: #888;
    }
    
    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    
    .actions {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: white;
      border-top: 1px solid #e0e0e0;
    }
    
    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: #25D366;
      color: white;
    }
    
    .btn-primary:hover {
      background: #128C7E;
    }
    
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .btn-danger {
      background: #ffebee;
      color: #c62828;
    }
    
    .btn-danger:hover {
      background: #ffcdd2;
    }
    
    /* Form Styles */
    .form-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
    }
    
    .form-overlay.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .form-modal {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 320px;
    }
    
    .form-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #333;
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    .form-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #25D366;
    }
    
    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .form-actions .btn {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🤖 WhatsApp Agent</h2>
    <div class="subtitle">by Lucas Moura & Marcus Vinicius</div>
  </div>
  
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Carregando...</span>
  </div>
  
  <div class="content">
    <div class="section-title">Perfis</div>
    <div class="profiles-list" id="profiles">
      <!-- Profiles will be rendered here -->
    </div>
  </div>
  
  <div class="actions">
    <button class="btn btn-primary" id="addBtn">
      <span>➕</span> Novo Perfil
    </button>
    <button class="btn btn-danger" id="deactivateBtn" style="display: none;">
      <span>⏹️</span> Desativar Extensão
    </button>
  </div>
  
  <!-- Form Modal -->
  <div class="form-overlay" id="formOverlay">
    <div class="form-modal">
      <div class="form-title" id="formTitle">Novo Perfil</div>
      <div class="form-group">
        <label>Nome do Perfil *</label>
        <input type="text" id="inputName" placeholder="Ex: Suporte, Vendas, etc.">
      </div>
      <div class="form-group">
        <label>Subtítulo (opcional)</label>
        <input type="text" id="inputSubtitle" placeholder="Ex: Turno Manhã, Setor A, etc.">
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Salvar</button>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
